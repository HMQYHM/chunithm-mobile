<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071018">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self'; manifest-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <title>CHUNITHM Mobile Skin Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="live2d.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">CHUNITHM MOBILE</div>
      <h1>Skin Studio</h1>
    </div>
    <div class="top-actions">
      <label class="button secondary">打开皮肤文件夹<input id="skinFolder" type="file" webkitdirectory multiple hidden></label>
      <label class="button secondary">导入皮肤 ZIP<input id="skinZip" type="file" accept=".zip,application/zip" hidden></label>
      <label class="button secondary">导入 JSON<input id="importJson" type="file" accept=".json,application/json" hidden></label>
      <button id="undoButton" class="secondary" title="撤回最近一次修改" disabled>撤回</button>
      <button id="redoButton" class="secondary" title="取消撤回" disabled>取消撤回</button>
      <button id="saveProject" class="secondary">保存</button>
      <button id="exportJson" class="button secondary">导出 JSON</button>
      <button id="exportZip" class="button primary">导出皮肤 ZIP</button>
    </div>
  </header>

  <main class="workspace">
    <section class="preview-column panel">
      <div class="panel-title"><span>游玩界面布局</span><span id="statusBadge" class="badge">游玩中</span></div>
      <div id="stage" class="stage" aria-label="横屏游玩界面预览">
        <div class="stage-grid"></div>
        <div class="lane lane-left"></div><div class="lane lane-right"></div><div class="goal-line"></div>
        <div id="airDemo" class="air-demo">AIR</div>
        <div id="metricDemo" class="metric-demo">COMBO 100</div>
      </div>
      <div class="preview-controls">
        <span>预览状态</span>
        <select id="previewState">
          <option value="playing">游玩中</option><option value="pause">暂停</option>
          <option value="miss">MISS</option><option value="combo100">Combo 100</option>
          <option value="air">AIR</option><option value="metricZero">目标值归零</option>
        </select>
        <label class="check"><input id="showGrid" type="checkbox" checked> 网格</label>
      </div>
    </section>

    <section class="layers-column panel">
      <div class="skin-identity">
      <label class="field"><span>皮肤名称</span><input id="skinName" type="text" maxlength="80"></label>
      <label class="field"><span>皮肤 ID</span><input id="skinId" type="text" maxlength="64"></label>
      </div>
      <div class="panel-title"><span>元素图层</span><button id="addElement" class="icon-button" title="添加元素">+</button></div>
      <div id="layerList" class="layer-list"></div>
      <div class="layer-actions"><button id="removeElement" class="button danger">移除当前元素</button></div>
      <div class="section-note">只能导出游戏已支持的元素 ID；按钮只改变外观和位置，不会替换原有行为。</div>
    </section>

    <section class="inspector-column panel">
      <div class="panel-title"><span>属性</span><div class="settings-tabs" role="tablist" aria-label="皮肤设置">
        <button id="layoutTab" role="tab" aria-controls="layoutSettings" aria-selected="false">界面布局</button>
        <button id="liveTab" role="tab" aria-controls="liveSettings" aria-selected="true">Live2D</button>
      </div></div>
      <div id="layoutSettings" role="tabpanel" aria-labelledby="layoutTab" hidden>
      <div id="emptyInspector" class="empty">请选择一个元素</div>
      <form id="inspector" class="inspector" hidden>
        <label class="field wide"><span>元素 ID</span><select id="elementId"></select></label>
        <label class="check wide"><input id="visible" type="checkbox"> 显示此元素</label>
        <div class="field-grid">
          <label class="field"><span>X</span><input id="x" type="number" min="0" max="1" step="0.001"></label>
          <label class="field"><span>Y</span><input id="y" type="number" min="0" max="1" step="0.001"></label>
          <label class="field"><span>宽度</span><input id="width" type="number" min="0.01" max="1" step="0.001"></label>
          <label class="field"><span>高度</span><input id="height" type="number" min="0.01" max="1" step="0.001"></label>
        </div>
        <label class="field wide"><span>透明度</span><input id="opacity" type="range" min="0" max="1" step="0.01"><output id="opacityValue">1.00</output></label>
        <label class="field wide"><span>颜色</span><input id="color" type="text" placeholder="#FFFFFF"></label>
        <label class="field wide"><span>图片路径</span><input id="image" type="text" placeholder="ui/layout/example.png"></label>
        <label class="button secondary wide upload">选择 PNG 图片<input id="imageFile" type="file" accept="image/png" hidden></label>
        <label class="field wide"><span>按钮/文字标签</span><input id="label" type="text" maxlength="80" placeholder="可选"></label>
        <div class="field-grid">
          <label class="field"><span>文字大小</span><input id="textSize" type="number" min="0" max="256" step="1" placeholder="跟随游戏"></label>
          <label class="field"><span>文字颜色</span><input id="textColor" type="text" placeholder="#FFFFFF"></label>
        </div>
      </form>

      <div class="metric-section">
        <div class="subheading">音符下方显示模式</div>
        <select id="metricMode" class="wide">
          <option value="combo">当前 Combo</option><option value="remaining_combo">剩余 Combo</option>
          <option value="score">当前分数</option><option value="sss+">SSS+ 剩余分数</option>
          <option value="sss">SSS 剩余分数</option><option value="ss+">SS+ 剩余分数</option>
          <option value="ss">SS 剩余分数</option><option value="s+">S+ 剩余分数</option>
          <option value="s">S 剩余分数</option><option value="lost_score">已损失分数</option>
          <option value="best_score">距离最好成绩</option>
        </select>
        <div id="metricDescription" class="section-note"></div>
      </div>
      <div class="metric-section number-style-section">
        <div class="subheading">数字与文字样式</div>
        <div class="field-grid">
          <label class="field"><span>Combo 字号</span><input id="comboFontSize" type="number" min="8" max="256" step="1"></label>
          <label class="field"><span>Combo 颜色</span><input id="comboColor" type="text" placeholder="#FFFFFF"></label>
          <label class="field"><span>分数字号</span><input id="scoreFontSize" type="number" min="8" max="256" step="1"></label>
          <label class="field"><span>分数颜色</span><input id="scoreColor" type="text" placeholder="#FFFFFF"></label>
          <label class="field"><span>判定字号</span><input id="judgementFontSize" type="number" min="8" max="256" step="1"></label>
          <label class="field"><span>判定颜色</span><input id="judgementColor" type="text" placeholder="#FFFFFF"></label>
        </div>
        <div id="digitEditors" class="digit-assets"></div>
        <div class="section-note">可分别为 Combo 和分数提供 0–9 PNG。缺少某个数字时，游戏会回退到文字显示。</div>
      </div>
      </div>
      <section id="liveSettings" class="live2d-section" role="tabpanel" aria-labelledby="liveTab">
        <h2 id="live2dTitle">Live2D</h2>
        <label class="check"><input id="liveEnabled" type="checkbox">启用 Live2D 模型</label>
        <div class="resource-actions">
          <label class="button secondary upload">导入模型文件夹<input id="modelFolder" type="file" webkitdirectory multiple hidden></label>
          <button id="bongoPreset" type="button">BongoCat 参数</button>
        </div>
        <label class="field"><span>模型 .model3.json</span><select id="modelSelect"><option value="">选择已导入的模型</option></select></label>
        <label class="field"><span>模型路径</span><input id="liveModel" type="text" placeholder="model/cat.model3.json"></label>
        <div id="modelStatus" role="status" class="resource-status">未导入模型</div>
        <div class="field-grid">
          <label class="field"><span>X</span><input data-live="x" type="number" min="0" max="0.99" step="0.001"></label>
          <label class="field"><span>Y</span><input data-live="y" type="number" min="0" max="0.99" step="0.001"></label>
          <label class="field"><span>宽度</span><input data-live="width" type="number" min="0.01" max="1" step="0.001"></label>
          <label class="field"><span>高度</span><input data-live="height" type="number" min="0.01" max="1" step="0.001"></label>
        </div>
        <details open><summary>左右手参数映射</summary><div id="liveParameters" class="live-fields"></div></details>
        <datalist id="liveParameterOptions"></datalist><datalist id="liveMotionOptions"></datalist>
        <details><summary>动作组与隐藏部件</summary><div id="liveMotions" class="live-fields"></div>
          <label class="field"><span>隐藏部件 ID（每行一个）</span><textarea id="hiddenParts" rows="4"></textarea></label>
        </details>
        <details><summary>模型背景 / 平板</summary>
          <label class="field"><span>背景 PNG 路径</span><input id="liveBackground" type="text" placeholder="model/resources/background.png"></label>
          <label class="button secondary upload">选择背景 PNG<input id="liveBackgroundFile" type="file" accept="image/png" hidden></label>
          <div class="field-grid" id="backgroundFields"></div>
        </details>
      </section>
    </section>
  </main>
  <footer class="footer"><span id="fileSummary">0 个资源</span><span id="historyStatus">未修改</span><span id="operationStatus" role="status" aria-live="polite"></span><span>本地资源 · 不执行包内代码</span></footer>
  <script src="live2d-config.js"></script>
  <script src="live2d-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
